name: RDP Comet First Run

on:
  workflow_dispatch:
  
jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
             -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" || Write-Host "No existing rule"
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Fixed Password
        run: |
          $fixedPassword = "Extra1234567890!"
          $securePass = ConvertTo-SecureString $fixedPassword -AsPlainText -Force

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
              Add-LocalGroupMember -Group "Administrators" -Member "RDP"
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
              Write-Host "Created user RDP"
          } else {
              Write-Host "User RDP already exists — skipping creation"
          }

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              Write-Error "User creation failed!"
              exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = Join-Path $env:TEMP "tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath -UseBasicParsing -ErrorAction Stop
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

      - name: Establish Tailscale Connection
        run: |
          $hostname = "gh-runner-$($env:GITHUB_RUN_ID)"
          $tsExe = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"
          & $tsExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=$hostname

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & $tsExe ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          Add-Content -Path $env:GITHUB_ENV -Value "TAILSCALE_IP=$tsIP"
          Write-Host "Assigned Tailscale IP: $tsIP"

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection, Display Hardcoded Credentials, and Deploy The Manifest
        run: |
          $ErrorActionPreference = "Stop"
          $fixedPassword = "Extra1234567890!"

          Write-Host "`n=== RDP ACCESS: ABSOLUTE TRUTH ==="
          Write-Host "Username: RDP"
          Write-Host "Password: $fixedPassword"
          Write-Host "============================`n"

          # ---- HARD-CODED PROFILE PATH ----
          # You requested RDP -> RDP.runnervm8crnl
          $ProfilePath = "C:\Users\RDP.runnervm8crnl"
          $ProfilePath = [System.IO.Path]::GetFullPath($ProfilePath)
          Write-Host "Using hardcoded profile path: $ProfilePath"

          # Derived dynamic (from hardcoded) paths
          $InstallRoot = Join-Path $ProfilePath "AppData\Local"
          $FinalDestination = Join-Path $InstallRoot "Perplexity"
          $PiidDir = Join-Path $FinalDestination "User Data"
          $DesktopPath = Join-Path $ProfilePath "Desktop"
          $TargetExePath = Join-Path $FinalDestination "Comet\Application\comet.exe"
          $ShortcutPath = Join-Path $DesktopPath "Comet.lnk"
          $ZipUrl = "https://github.com/San-Shiro/comet-clean-rdp/releases/download/releases/Perplexity.zip"
          $DownloadPath = Join-Path $env:TEMP "Perplexity.zip"
          $ExtractPath = Join-Path $env:TEMP "Perplexity_Extract"

          Write-Host "InstallRoot: $InstallRoot"
          Write-Host "FinalDestination: $FinalDestination"
          Write-Host "DesktopPath: $DesktopPath"
          Write-Host "TargetExePath: $TargetExePath"

          # Download
          try {
              if (-not (Test-Path $InstallRoot)) { New-Item -Path $InstallRoot -ItemType Directory -Force | Out-Null }
              if (Test-Path $DownloadPath) { Remove-Item $DownloadPath -Force -ErrorAction SilentlyContinue }
              Invoke-WebRequest -Uri $ZipUrl -OutFile $DownloadPath -UseBasicParsing -ErrorAction Stop
              Write-Host "Downloaded $DownloadPath"
          } catch {
              Write-Error "Download failed: $($_.Exception.Message)"
          }

          # Extract + move
          try {
              if (Test-Path $ExtractPath) { Remove-Item -Path $ExtractPath -Recurse -Force -ErrorAction SilentlyContinue }
              New-Item -Path $ExtractPath -ItemType Directory -Force | Out-Null
              Expand-Archive -Path $DownloadPath -DestinationPath $ExtractPath -Force
              Write-Host "Extracted to $ExtractPath"

              $found = Get-ChildItem -Path $ExtractPath -Directory -ErrorAction SilentlyContinue |
                       Where-Object { $_.Name -match '^(Comet|Perplexity)$' } |
                       Select-Object -First 1

              if ($found) {
                  $sourceTop = $found.FullName
              } else {
                  $foundRec = Get-ChildItem -Path $ExtractPath -Directory -Recurse -ErrorAction SilentlyContinue |
                              Where-Object { $_.Name -eq 'Comet' -or $_.Name -eq 'Perplexity' } |
                              Select-Object -First 1
                  if ($foundRec) { $sourceTop = $foundRec.FullName } else { $sourceTop = $ExtractPath; Write-Warning "Using whole extract root." }
              }

              if (-not (Test-Path $FinalDestination)) { New-Item -Path $FinalDestination -ItemType Directory -Force | Out-Null }

              if ($sourceTop -eq $ExtractPath) {
                  Get-ChildItem -Path $ExtractPath -Force | ForEach-Object {
                      $dest = Join-Path $FinalDestination $_.Name
                      if (Test-Path $dest) { Remove-Item -Path $dest -Recurse -Force -ErrorAction SilentlyContinue }
                      Move-Item -Path $_.FullName -Destination $FinalDestination -Force
                  }
              } else {
                  $parentDest = (Split-Path -Path $FinalDestination -Parent)
                  if ($found -and ($found.Name -ieq "Perplexity")) {
                      if (Test-Path (Join-Path $parentDest $found.Name)) { Remove-Item -Path (Join-Path $parentDest $found.Name) -Recurse -Force -ErrorAction SilentlyContinue }
                      Move-Item -Path $sourceTop -Destination $parentDest -Force
                  } else {
                      Get-ChildItem -Path $sourceTop -Force | ForEach-Object {
                          $dest = Join-Path $FinalDestination $_.Name
                          if (Test-Path $dest) { Remove-Item -Path $dest -Recurse -Force -ErrorAction SilentlyContinue }
                          Move-Item -Path $_.FullName -Destination $FinalDestination -Force
                      }
                  }
              }

              Remove-Item -Path $DownloadPath -Force -ErrorAction SilentlyContinue
              Remove-Item -Path $ExtractPath -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "Files moved to $FinalDestination"
          } catch {
              Write-Error "Extract/move failed: $($_.Exception.Message)"
          }

          # PIID
          try {
              $NewGUID = [guid]::NewGuid().Guid
              if (-not (Test-Path $PiidDir)) { New-Item -Path $PiidDir -ItemType Directory -Force | Out-Null }
              $PiidFilePath = Join-Path $PiidDir "piid"
              Set-Content -Path $PiidFilePath -Value $NewGUID -Encoding UTF8
              Write-Host "PIID written: $PiidFilePath"
          } catch {
              Write-Error "Failed to write PIID: $($_.Exception.Message)"
          }

          # Shortcut
          try {
              if (-not (Test-Path $DesktopPath)) { New-Item -Path $DesktopPath -ItemType Directory -Force | Out-Null }
              $maxRetries = 20
              $count = 0
              while (-not (Test-Path $TargetExePath) -and ($count -lt $maxRetries)) {
                  Write-Host "Waiting for $TargetExePath... ($($count+1)/$maxRetries)"
                  Start-Sleep -Seconds 3
                  $count++
              }
              if (-not (Test-Path $TargetExePath)) { Write-Warning "Target exe not found; creating shortcut to expected path." }

              $Shell = New-Object -ComObject WScript.Shell
              $Shortcut = $Shell.CreateShortcut($ShortcutPath)
              $Shortcut.TargetPath = $TargetExePath
              $Shortcut.WorkingDirectory = Split-Path -Path $TargetExePath -Parent
              $Shortcut.Description = "Comet Browser - Automated by workflow"
              $Shortcut.Arguments = "--no-first-run"
              $Shortcut.IconLocation = "$TargetExePath,0"
              $Shortcut.Save()
              Write-Host "Shortcut created: $ShortcutPath"
          } catch {
              Write-Error "Failed to create desktop shortcut: $($_.Exception.Message)"
          }

          Write-Host "Deployment complete."

          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active and Comet Deployed - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
