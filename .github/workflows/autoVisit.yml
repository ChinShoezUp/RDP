name: RDP Firefox uBlock

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Create interactive scheduled task to open Firefox, wait 15s, then cancel workflow
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Config - change these as needed
          $user = "RDP"
          $password = "Extra1234567890!"           # recommend: replace with ${{ secrets.RDP_PASSWORD }}
          $url = "https://example.com"             # <-- change to target URL
          $waitSeconds = 15                        # <-- wait 15 seconds
          $profileDir = "C:\Users\RDP"
          $scriptPath = Join-Path $profileDir "RunFirefoxVisitAndCancel.ps1"
          $infoPath = Join-Path $profileDir "run_cancel_info.env"
          $firefoxPath = "C:\Program Files\Mozilla Firefox\firefox.exe"

          # Ensure profile dir exists
          if (-not (Test-Path $profileDir)) { New-Item -Path $profileDir -ItemType Directory -Force | Out-Null }

          # --- Write run info file (owner/repo, run id, token) ---
          $ownerRepo = "${{ github.repository }}"  # owner/repo
          $runId = "${{ github.run_id }}"

          # NOTE: Put a PAT with rights to cancel workflow in repo secret named ACTIONS_CANCEL_TOKEN
          $token = "${{ secrets.ACTIONS_CANCEL_TOKEN }}"

          $envContent = @"
GITHUB_REPOSITORY=$ownerRepo
GITHUB_RUN_ID=$runId
ACTIONS_CANCEL_TOKEN=$token
"@
          Set-Content -Path $infoPath -Value $envContent -Encoding UTF8 -Force

          # Restrict the file so only RDP and Administrators can read it
          icacls $infoPath /inheritance:r | Out-Null
          icacls $infoPath /grant "RDP:R" | Out-Null
          icacls $infoPath /grant "Administrators:R" | Out-Null
          icacls $infoPath /remove "Users" "Everyone" | Out-Null

          # --- Create the PowerShell wrapper script that the scheduled task will run ---
          $script = @"
# RunFirefoxVisitAndCancel.ps1 - created by workflow
param()

# Read simple key=value run info
if (-not (Test-Path `"$infoPath`")) { Write-Error 'run info file missing'; exit 1 }
\$kv = @{ }
Get-Content -Path `"$infoPath`" | ForEach-Object {
    if (\$_ -match '^\s*([^=]+)=(.*)\s*$') { \$kv[\$matches[1]] = \$matches[2] }
}

\$ownerRepo = \$kv['GITHUB_REPOSITORY']
\$runId = \$kv['GITHUB_RUN_ID']
\$token = \$kv['ACTIONS_CANCEL_TOKEN']

# Launch Firefox to the URL
Start-Process -FilePath `"$firefoxPath`" -ArgumentList `"$url`" -ErrorAction SilentlyContinue
Start-Sleep -Seconds $waitSeconds

# Attempt graceful close then force
Get-Process -Name firefox -ErrorAction SilentlyContinue | ForEach-Object {
    try { \$_.CloseMainWindow() | Out-Null } catch {}
}
Start-Sleep -Seconds 2
Get-Process -Name firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

# Cancel the GitHub Actions workflow run via REST API
if (\$ownerRepo -and \$runId -and \$token) {
    \$parts = \$ownerRepo.Split('/')
    \$owner = \$parts[0]; \$repo = \$parts[1]
    \$uri = "https://api.github.com/repos/\$owner/\$repo/actions/runs/\$runId/cancel"
    try {
        Invoke-RestMethod -Method Post -Uri \$uri -Headers @{ Authorization = "Bearer \$token"; "User-Agent"="gh-action-canceller" } -ErrorAction Stop
        Start-Sleep -Seconds 2
    } catch {
        Write-Warning "Failed to cancel via API: \$($_.Exception.Message)"
    }
} else {
    Write-Warning "Missing owner/repo/runId/token — cannot cancel workflow automatically."
}

# Cleanup: remove scheduled task and info file
try { schtasks /Delete /TN "RDP_Firefox_Visit" /F | Out-Null } catch {}
try { Remove-Item -Path `"$infoPath`" -Force -ErrorAction SilentlyContinue } catch {}

"@

          # Save wrapper script to RDP profile
          Set-Content -Path $scriptPath -Value $script -Encoding UTF8 -Force

          # Secure the script for RDP user
          icacls $scriptPath /inheritance:r | Out-Null
          icacls $scriptPath /grant "RDP:R" | Out-Null
          icacls $scriptPath /grant "Administrators:R" | Out-Null
          icacls $scriptPath /remove "Users" "Everyone" | Out-Null

          # Create interactive scheduled task to run on next logon
          $taskName = "RDP_Firefox_Visit"
          $taskAction = "powershell -NoProfile -ExecutionPolicy Bypass -WindowStyle Normal -File `"$scriptPath`""
          $createCmd = "schtasks /Create /TN `"$taskName`" /TR `"$taskAction`" /SC ONLOGON /RL HIGHEST /RU $user /RP $password /F /IT"
          Write-Host "Creating scheduled task: $createCmd"
          Invoke-Expression $createCmd

          Write-Host "Scheduled task created. Sign in to user '$user' interactively; the task will open Firefox, wait $waitSeconds seconds, then attempt to cancel workflow run $runId."
